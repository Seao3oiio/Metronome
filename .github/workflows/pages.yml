name: Publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Type "stable" to publish main to the stable site
        required: true
        type: string

permissions:
  contents: read

jobs:
  dev:
    if: github.event_name == 'push'
    name: Trigger dev deployment
    runs-on: ubuntu-latest
    steps:
      - name: Deploy this commit to Metronome-dev
        env:
          DEV_REPOSITORY: Seao3oiio/Metronome-dev
          GH_TOKEN: ${{ secrets.DEV_REPO_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api \
            --method POST \
            "/repos/${DEV_REPOSITORY}/dispatches" \
            --field event_type=deploy \
            --field "client_payload[sha]=${SOURCE_SHA}"

  stable:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.release == 'stable'
    name: Publish stable
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: stable-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
